services:
  mysql:
    image: mysql:8
    container_name: backend-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-backend}k
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: backend-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
